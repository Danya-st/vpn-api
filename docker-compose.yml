services:
  api:
    build: ./backend
    container_name: vpn-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    ports:
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ контейнера к 3x-ui, запущенному на хосте (network_mode: host)
    volumes:
      - vpn_data:/data                         # журнал платежей и книга платежей
      - /etc/letsencrypt:/etc/letsencrypt:ro   # Монтируем сертификаты в контейнер
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  vpn_data:
